services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REMOTE_TARGET_URL: http://127.0.0.1
    volumes:
    - submission:/submission
    - forward-bridge:/run/dojo-forward
    depends_on:
      gateway:
        condition: service_started
      oracle:
        condition: service_healthy
      target:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 240
  target-netns:
    image: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    command:
    - sleep
    - infinity
    networks:
    - target-net
  target:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#7783c150e0c3a447c8aafe59096a697ce7e0d227
    environment:
      DB_HOST: 127.0.0.1
      DB_NAME: xss
      DB_USER: postgres
      DB_PASSWORD: local-compose-django-001-db
      DJANGO_SECRET_KEY: ''
    network_mode: service:target-netns
    volumes:
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle:ro
    - oracle-seed:/run/dojo-seed
    post_start:
    - command: /bin/sh /run/dojo-seed/install.sh
      user: root
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target-netns:
        condition: service_started
      db:
        condition: service_started
      victim:
        condition: service_started
  db:
    image: public.ecr.aws/docker/library/postgres:9.6-alpine@sha256:8342bcb43446694428ec6594e72e4299692854f0fc3aca090b0ab46f4c7f32a1
    environment:
      POSTGRES_PASSWORD: local-compose-django-001-db
      POSTGRES_DB: xss
    network_mode: service:target-netns
    volumes:
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle:ro
    depends_on:
      target-netns:
        condition: service_started
  victim:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#7783c150e0c3a447c8aafe59096a697ce7e0d227:victim
      dockerfile_inline: 'FROM python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89


        RUN apk add --no-cache chromium

        COPY server.py /victim/server.py

        EXPOSE 9222

        CMD ["python", "/victim/server.py"]

        '
    network_mode: service:target-netns
    volumes:
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle:ro
    depends_on:
      target-netns:
        condition: service_started
  oracle-init:
    build:
      context: .
      dockerfile: Oracle.Dockerfile
    network_mode: none
    command:
    - /bin/sh
    - -ec
    - install -m 0755 /usr/local/bin/dojo-rce-helper /run/oracle-proof/helper && python3 /oracle/runtime_oracle.py init --config /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof
    - oracle-socket:/run/dojo-oracle
    - submission:/submission
  oracle:
    build:
      context: .
      dockerfile: Oracle.Dockerfile
    network_mode: service:target-netns
    environment: {}
    command:
    - python3
    - /oracle/runtime_oracle.py
    - serve
    - --config
    - /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle
    - submission:/submission:ro
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target:
        condition: service_started
      target-netns:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python3
      - /oracle/runtime_oracle.py
      - health
      - --config
      - /oracle/config.json
      interval: 2s
      timeout: 5s
      retries: 180
  gateway:
    build:
      context: .
      dockerfile: Oracle.Dockerfile
    network_mode: service:target-netns
    command:
    - /opt/dojo/gateway-entrypoint.sh
    volumes:
    - forward-bridge:/run/dojo-forward
    depends_on:
      target:
        condition: service_started
      target-netns:
        condition: service_started
networks:
  target-net:
    internal: true
volumes:
  submission: {}
  forward-bridge: {}
  oracle-private: {}
  oracle-seed: {}
  oracle-proof: {}
  oracle-socket: {}
