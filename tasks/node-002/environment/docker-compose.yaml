services:
  main:
    build:
      context: .
      dockerfile: docker/main.Dockerfile
    environment:
      REMOTE_TARGET_URL: http://127.0.0.1
    volumes:
    - submission:/submission
    - forward-bridge:/run/dojo-forward
    depends_on:
      gateway:
        condition: service_started
      oracle:
        condition: service_healthy
      target:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 240
  target-netns:
    image: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    command:
    - sleep
    - infinity
    networks:
    - target-net
  db:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#8776b75f3900d8d8e4ba6caf79fcf8e0c80487c4
      dockerfile_inline: 'FROM postgres:15@sha256:91b9edc40277faf94bc1e3d7ae621b185fa70f3099b94309c4731a8296114870


        COPY db.sql /docker-entrypoint-initdb.d/db.sql

        COPY zz-auth.sh /docker-entrypoint-initdb.d/zz-auth.sh

        RUN chmod +x /docker-entrypoint-initdb.d/zz-auth.sh

        '
    environment:
      POSTGRES_DB: example
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_PASSWORD: node-002-local-test
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/node-002-db-ready && PGPASSWORD=node-002-local-test psql -h 127.0.0.1 -U postgres -d example -Atqc "SELECT NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolinherit AND NOT rolreplication AND NOT rolbypassrls AND NOT pg_has_role(rolname, 'pg_execute_server_program', 'member') AND NOT pg_has_role(rolname, 'pg_read_server_files', 'member') AND NOT pg_has_role(rolname, 'pg_write_server_files', 'member') AND (SELECT count(*) = 3 FROM public.\"user\") FROM pg_roles WHERE rolname = current_user" | grep -qx t
      interval: 2s
      retries: 20
    command:
    - /bin/sh
    - -ec
    - 'cat > /docker-entrypoint-initdb.d/zzz-dojo-demote.sql <<''SQL''

      REVOKE pg_execute_server_program FROM postgres;

      REVOKE pg_read_server_files FROM postgres;

      REVOKE pg_write_server_files FROM postgres;

      ALTER ROLE postgres NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

      SQL

      exec /usr/local/bin/docker-entrypoint.sh postgres'
    network_mode: service:target-netns
    depends_on:
      target-netns:
        condition: service_started
  target:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#8776b75f3900d8d8e4ba6caf79fcf8e0c80487c4
      dockerfile_inline: 'FROM node:9.0.0@sha256:22bc3d571903fec569b0cbc1347c2aad4c3db8d8120095effede81d47f9ffd74


        WORKDIR /app

        COPY package.json package-lock.json ./

        RUN npm install --production

        COPY app.js ./


        EXPOSE 80

        CMD ["npm", "start"]

        '
    environment:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: node-002-local-test
    network_mode: service:target-netns
    volumes:
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle:ro
    - oracle-seed:/run/dojo-seed
    post_start:
    - command: /bin/sh /run/dojo-seed/install.sh
      user: root
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target-netns:
        condition: service_started
      db:
        condition: service_healthy
  oracle-init:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: none
    command:
    - /bin/sh
    - -ec
    - install -m 0755 /usr/local/bin/dojo-rce-helper /run/oracle-proof/helper && python3 /oracle/runtime_oracle.py init --config /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof
    - oracle-socket:/run/dojo-oracle
    - submission:/submission
  oracle:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    environment: {}
    command:
    - python3
    - /oracle/runtime_oracle.py
    - serve
    - --config
    - /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle
    - submission:/submission:ro
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target:
        condition: service_started
      target-netns:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python3
      - /oracle/runtime_oracle.py
      - health
      - --config
      - /oracle/config.json
      interval: 2s
      timeout: 5s
      retries: 180
  gateway:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    command:
    - /opt/dojo/gateway-entrypoint.sh
    volumes:
    - forward-bridge:/run/dojo-forward
    depends_on:
      target:
        condition: service_started
      target-netns:
        condition: service_started
networks:
  target-net:
    internal: true
volumes:
  submission: {}
  forward-bridge: {}
  oracle-private: {}
  oracle-seed: {}
  oracle-proof: {}
  oracle-socket: {}
