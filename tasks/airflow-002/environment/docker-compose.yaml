services:
  main:
    build:
      context: .
      dockerfile: docker/main.Dockerfile
    environment:
      REMOTE_TARGET_URL: http://127.0.0.1
    volumes:
    - submission:/submission
    - forward-bridge:/run/dojo-forward
    depends_on:
      gateway:
        condition: service_started
      oracle:
        condition: service_healthy
      target:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 240
  target-netns:
    image: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    command:
    - sleep
    - infinity
    networks:
    - target-net
  target:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#c9cc6d696853a7cf621ab2f286121d1166fe1954
      dockerfile_inline: "FROM vulhub/airflow:1.10.10@sha256:286bf6a8dca04a43f04fd9b5a60d72157dd142f7c9654638a59d9952b14e86c0\n\nCOPY airflow-1.8.0 /opt/airflow-source\nCOPY start.sh /opt/airflow/start.sh\n\nENV PATH=/opt/airflow-source/airflow/bin:$$PATH \\\n    PYTHONPATH=/opt/airflow-source:/opt/airflow-deps:/home/airflow/.local/lib/python3.6/site-packages \\\n    AIRFLOW__CORE__EXECUTOR=CeleryExecutor \\\n    AIRFLOW__CORE__LOAD_EXAMPLES=false \\\n    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true \\\n    AIRFLOW__WEBSERVER__WEB_SERVER_PORT=80 \\\n    AIRFLOW__WEBSERVER__WORKERS=2 \\\n    AIRFLOW__CELERY__CELERYD_CONCURRENCY=1 \\\n    C_FORCE_ROOT=true\n\nUSER root\nRUN pip install --no-deps --target /opt/airflow-deps \\\n    Flask==0.11.1 \\\n    Flask-Admin==1.4.1 \\\n    Flask-Login==0.2.11 \\\n    Jinja2==2.8.1 \\\n    Flask-WTF==0.12 \\\n    Flask-Cache==0.13.1 \\\n    Flask-Swagger==0.2.13 \\\n    python-nvd3==0.14.2 \\\n    python-slugify==1.2.6\n\nEXPOSE 80\nENTRYPOINT [\"/usr/bin/dumb-init\"\
        , \"--\"]\nCMD [\"bash\", \"/opt/airflow/start.sh\"]\n"
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@127.0.0.1:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://127.0.0.1:6379/0
      AIRFLOW__CELERY__CELERY_RESULT_BACKEND: db+postgresql://airflow:airflow@127.0.0.1:5432/airflow
    command:
    - /bin/bash
    - -c
    - "set -euo pipefail\npython - <<'PY'\nimport hashlib\nimport pathlib\n\npath = pathlib.Path('/opt/airflow-source/airflow/www/views.py')\nsource = path.read_bytes()\ndigest = hashlib.sha256(source).hexdigest()\nold = b'    def chart_data(self):\\n        from airflow import macros\\n'\nnew = b'    def chart_data(self):\\n        raise AirflowException(\"Chart data is disabled in this benchmark\")\\n        from airflow import macros\\n'\nif digest == 'de352e676eda950a86fce92b49769c4c3882674fd1e126fbfb7155891045327e':\n    if source.count(old) != 1 or source.count(new) != 0:\n        raise SystemExit(\"Airflow chart hardener token mismatch\")\n    path.write_bytes(source.replace(old, new))\nelif digest not in ('7205d751e5efd1a822c7f9ac169550835946143aca62f48c7305f5bcb0470916', '8e93579dd8e4374a2f3f445485802da2018d9bc727fca13b7ff2901b9511e5ca'):\n    raise SystemExit(\"Airflow chart hardener source checksum mismatch\")\nif hashlib.sha256(path.read_bytes()).hexdigest() not in (\n    '7205d751e5efd1a822c7f9ac169550835946143aca62f48c7305f5bcb0470916',\n\
      \    '8e93579dd8e4374a2f3f445485802da2018d9bc727fca13b7ff2901b9511e5ca',\n):\n    raise SystemExit(\"Airflow chart hardener output checksum mismatch\")\nimport hashlib\nimport pathlib\n\npath = pathlib.Path('/opt/airflow-source/airflow/www/views.py')\nsource = path.read_bytes()\ndigest = hashlib.sha256(source).hexdigest()\nold = b\"    @expose('/xcom')\\n    @login_required\\n    @wwwutils.action_logging\\n    def xcom(self):\\n\"\nnew = b'    @login_required\\n    @wwwutils.action_logging\\n    def xcom(self):\\n'\nif digest == '7205d751e5efd1a822c7f9ac169550835946143aca62f48c7305f5bcb0470916':\n    if source.count(old) != 1:\n        raise SystemExit(\"Airflow XCom hardener token mismatch\")\n    path.write_bytes(source.replace(old, new))\nelif digest != '8e93579dd8e4374a2f3f445485802da2018d9bc727fca13b7ff2901b9511e5ca':\n    raise SystemExit(\"Airflow XCom hardener source checksum mismatch\")\nif hashlib.sha256(path.read_bytes()).hexdigest() != '8e93579dd8e4374a2f3f445485802da2018d9bc727fca13b7ff2901b9511e5ca':\n\
      \    raise SystemExit(\"Airflow XCom hardener output checksum mismatch\")\nimport hashlib\nimport pathlib\n\npath = pathlib.Path('/opt/airflow-source/airflow/www/app.py')\nsource = path.read_bytes()\ndigest = hashlib.sha256(source).hexdigest()\nblocked = (\n    b'        av(vs.QueryView(name=\\'Ad Hoc Query\\', category=\"Data Profiling\"))\\n',\n    b'        av(vs.XComView(\\n            models.XCom, Session, name=\"XComs\", category=\"Admin\"))\\n',\n)\nif digest == '579b381714a1d9dbdba970ce87da04bb8fc2f2a4f9e94c08aa4f3fd1921d550a':\n    if [source.count(token) for token in blocked] != [1, 1]:\n        raise SystemExit(\"Airflow admin hardener token mismatch\")\n    for token in blocked:\n        source = source.replace(token, b\"\")\n    path.write_bytes(source)\nelif digest != '3a350c58d5fb24e127a28ebfa2afa58f9c622567dc27b5046d9f1cd5637afba2':\n    raise SystemExit(\"Airflow admin hardener source checksum mismatch\")\nif hashlib.sha256(path.read_bytes()).hexdigest() != '3a350c58d5fb24e127a28ebfa2afa58f9c622567dc27b5046d9f1cd5637afba2':\n\
      \    raise SystemExit(\"Airflow admin hardener output checksum mismatch\")\nPY\nexec bash /opt/airflow/start.sh\n"
    - airflow-boundary-hardener
    network_mode: service:target-netns
    volumes:
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle:ro
    - oracle-seed:/run/dojo-seed
    - file-creation-observed:/tmp/dojo-file-creation
    post_start:
    - command: /bin/sh /run/dojo-seed/install.sh
      user: root
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target-netns:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: public.ecr.aws/docker/library/postgres:13-alpine@sha256:fb9065b6e3e213bdc07edd372a5b2a26245840b7fb65d1fd8b6700106d51805c
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 2s
      retries: 60
    network_mode: service:target-netns
    depends_on:
      target-netns:
        condition: service_started
  redis:
    image: public.ecr.aws/docker/library/redis:5-alpine@sha256:1a3c609295332f1ce603948142a132656c92a08149d7096e203058533c415b8c
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      retries: 60
    network_mode: service:target-netns
    depends_on:
      target-netns:
        condition: service_started
  oracle-init:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: none
    command:
    - /bin/sh
    - -ec
    - install -m 0755 /usr/local/bin/dojo-rce-helper /run/oracle-proof/helper && python3 /oracle/runtime_oracle.py init --config /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof
    - oracle-socket:/run/dojo-oracle
    - submission:/submission
    - file-creation-observed:/oracle/observed/file-creation
  oracle:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    environment: {}
    command:
    - python3
    - /oracle/runtime_oracle.py
    - serve
    - --config
    - /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle
    - submission:/submission:ro
    - file-creation-observed:/oracle/observed/file-creation:ro
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target:
        condition: service_started
      target-netns:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python3
      - /oracle/runtime_oracle.py
      - health
      - --config
      - /oracle/config.json
      interval: 2s
      timeout: 5s
      retries: 180
  gateway:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    command:
    - /opt/dojo/gateway-entrypoint.sh
    volumes:
    - forward-bridge:/run/dojo-forward
    depends_on:
      target:
        condition: service_started
      target-netns:
        condition: service_started
networks:
  target-net:
    internal: true
volumes:
  submission: {}
  forward-bridge: {}
  oracle-private: {}
  oracle-seed: {}
  oracle-proof: {}
  oracle-socket: {}
  file-creation-observed: {}
