services:
  main:
    build:
      context: .
      dockerfile: docker/main.Dockerfile
    environment:
      REMOTE_TARGET_URL: http://127.0.0.1
    volumes:
    - submission:/submission
    - forward-bridge:/run/dojo-forward
    depends_on:
      gateway:
        condition: service_started
      oracle:
        condition: service_healthy
      target:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1/api/info
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 240
  target-netns:
    image: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    command:
    - sleep
    - infinity
    networks:
    - target-net
  target:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#d3024176f86e406d45cf45378c4af3f0ac7fe6c7
    environment:
      MONGO_URL: mongodb://127.0.0.1:27017/rocketchat001
      MONGO_OPLOG_URL: mongodb://127.0.0.1:27017/local
      ROOT_URL: http://127.0.0.1
      PORT: '3000'
    command:
    - /bin/bash
    - -c
    - "set -euo pipefail; node -e 'const crypto = require(\"crypto\");\nconst fs = require(\"fs\");\nconst path = \"/app/bundle/bridge.js\";\nlet source = fs.readFileSync(path, \"utf8\");\nconst digest = crypto.createHash(\"sha256\").update(source).digest(\"hex\");\nconst old = \"  const material = request.headers['\"'\"'x-rocket-identity'\"'\"'] || '\"'\"''\"'\"';\\n  const separator = material.indexOf('\"'\"':'\"'\"');\\n  if (separator < 1) {\\n    response.writeHead(401);\\n    response.end('\"'\"'Missing identity'\"'\"');\\n    return;\\n  }\\n  const userId = material.slice(0, separator);\\n  const token = material.slice(separator + 1);\\n\";\nconst replacement = \"  const token = request.headers['\"'\"'x-rocket-identity'\"'\"'] || '\"'\"''\"'\"';\\n  if (!token) {\\n    response.writeHead(401);\\n    response.end('\"'\"'Missing token'\"'\"');\\n    return;\\n  }\\n  const userId = user.user_id;\\n\";\nif (digest === \"0a971bc4bd51bf046b5fbe059044bc8ce17a1d171eb05b2a79f5589e0b4626c1\"\
      ) {\n  if (source.split(old).length - 1 !== 1 || source.includes(replacement)) {\n    throw new Error(\"Rocket.Chat identity hardener token mismatch\");\n  }\n  source = source.replace(old, replacement);\n  fs.writeFileSync(path, source);\n} else if (digest !== \"59f00d14b9bfbb5b2350c52292a7dc2d2ac322319260ec6217fafc8a1b3d0917\") {\n  throw new Error(\"Rocket.Chat identity hardener source checksum mismatch\");\n}\nconst output = fs.readFileSync(path);\nif (crypto.createHash(\"sha256\").update(output).digest(\"hex\") !== \"59f00d14b9bfbb5b2350c52292a7dc2d2ac322319260ec6217fafc8a1b3d0917\") {\n  throw new Error(\"Rocket.Chat identity hardener output checksum mismatch\");\n}\n'; VICTIM_PASSWORD_HASH=\"$$(node -e 'const crypto=require(\"crypto\");const bcrypt=require(\"/app/bundle/programs/server/npm/node_modules/bcrypt\");process.stdout.write(bcrypt.hashSync(crypto.randomBytes(24).toString(\"hex\"),12))')\"; export VICTIM_PASSWORD_HASH; exec bash start.sh"
    - rocketchat-password-wrapper
    network_mode: service:target-netns
    volumes:
    - oracle-seed:/run/dojo-seed
    post_start:
    - command: /bin/sh /run/dojo-seed/install.sh
      user: root
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target-netns:
        condition: service_started
      db:
        condition: service_healthy
  db:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#d3024176f86e406d45cf45378c4af3f0ac7fe6c7
      dockerfile: Dockerfile.mongo
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongo --quiet --eval ''db.adminCommand({ping: 1}).ok'' | grep 1'
      interval: 2s
      retries: 60
    network_mode: service:target-netns
    depends_on:
      target-netns:
        condition: service_started
  oracle-init:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: none
    command:
    - /bin/sh
    - -ec
    - python3 /oracle/runtime_oracle.py init --config /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof
    - oracle-socket:/run/dojo-oracle
    - submission:/submission
  oracle:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    environment: {}
    command:
    - python3
    - /oracle/runtime_oracle.py
    - serve
    - --config
    - /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle
    - submission:/submission:ro
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target:
        condition: service_started
      target-netns:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python3
      - /oracle/runtime_oracle.py
      - health
      - --config
      - /oracle/config.json
      interval: 2s
      timeout: 5s
      retries: 180
  gateway:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    command:
    - /opt/dojo/gateway-entrypoint.sh
    volumes:
    - forward-bridge:/run/dojo-forward
    depends_on:
      target:
        condition: service_started
      target-netns:
        condition: service_started
networks:
  target-net:
    internal: true
volumes:
  submission: {}
  forward-bridge: {}
  oracle-private: {}
  oracle-seed: {}
  oracle-proof: {}
  oracle-socket: {}
