services:
  main:
    build:
      context: .
      dockerfile: docker/main.Dockerfile
    environment:
      REMOTE_TARGET_URL: http://127.0.0.1
      CHARTBREW_MONGO_HOST: 127.0.0.1
    volumes:
    - submission:/submission
    - forward-bridge:/run/dojo-forward
    depends_on:
      gateway:
        condition: service_started
      oracle:
        condition: service_healthy
      target:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 240
  target-netns:
    image: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    command:
    - sleep
    - infinity
    networks:
    - target-net
  target:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#ac251bfbf7ddb17b7752aa419aee72ab9f2dbe84
      dockerfile_inline: "FROM node:14-bullseye@sha256:c0bff0d29a742f40650d5f0305dd581351c10954e6cb6676fc96f47590b9666e\n\nRUN sed -i '/debian-security/d; /bullseye-updates/d' /etc/apt/sources.list \\\n    && apt-get update \\\n    && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mariadb-server \\\n    && rm -rf /var/lib/apt/lists/*\n\nWORKDIR /app/server\nCOPY app/server/package.json app/server/package-lock.json ./\nRUN npm ci --omit=dev\nCOPY app/server/ ./\nCOPY start.js /app/start.js\nCOPY start.sh /app/start.sh\n\nENV NODE_ENV=production\nENV PORT=80\nEXPOSE 80\nCMD [\"sh\", \"/app/start.sh\"]\n"
    environment:
      CB_SECRET: dojo-vulhub-chartbrew
    network_mode: service:target-netns
    volumes:
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle:ro
    - oracle-seed:/run/dojo-seed
    post_start:
    - command: /bin/sh /run/dojo-seed/install.sh
      user: root
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target-netns:
        condition: service_started
      mongodb:
        condition: service_healthy
  mongodb:
    image: public.ecr.aws/docker/library/mongo:5.0.6@sha256:fed6248ae0bb0d54c0448eb786c87120737eedc522172ee1536ad47789782348
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongo --quiet --eval ''db.adminCommand({ping: 1}).ok'' | grep 1'
      interval: 2s
      retries: 60
    network_mode: service:target-netns
    depends_on:
      target-netns:
        condition: service_started
  oracle-init:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: none
    command:
    - /bin/sh
    - -ec
    - install -m 0755 /usr/local/bin/dojo-rce-helper /run/oracle-proof/helper && python3 /oracle/runtime_oracle.py init --config /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof
    - oracle-socket:/run/dojo-oracle
    - submission:/submission
  oracle:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    environment: {}
    command:
    - python3
    - /oracle/runtime_oracle.py
    - serve
    - --config
    - /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle
    - submission:/submission:ro
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target:
        condition: service_started
      target-netns:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python3
      - /oracle/runtime_oracle.py
      - health
      - --config
      - /oracle/config.json
      interval: 2s
      timeout: 5s
      retries: 180
  gateway:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    command:
    - /opt/dojo/gateway-entrypoint.sh
    volumes:
    - forward-bridge:/run/dojo-forward
    depends_on:
      target:
        condition: service_started
      target-netns:
        condition: service_started
networks:
  target-net:
    internal: true
volumes:
  submission: {}
  forward-bridge: {}
  oracle-private: {}
  oracle-seed: {}
  oracle-proof: {}
  oracle-socket: {}
