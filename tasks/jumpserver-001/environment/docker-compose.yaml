services:
  main:
    build:
      context: .
      dockerfile: docker/main.Dockerfile
    environment:
      REMOTE_TARGET_URL: http://127.0.0.1
    volumes:
    - submission:/submission
    - forward-bridge:/run/dojo-forward
    depends_on:
      gateway:
        condition: service_started
      oracle:
        condition: service_healthy
      target:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 240
  target-netns:
    image: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    command:
    - sleep
    - infinity
    networks:
    - target-net
  mariadb:
    image: mariadb:10.11.5@sha256:d98220e8513201e1a0a720724b8599024854b7bf33afea81ac1dd3c54dd47420
    environment:
      MARIADB_ROOT_PASSWORD: jumpserver-local-test
      MARIADB_DATABASE: jumpserver
    healthcheck:
      test:
      - CMD-SHELL
      - mariadb-admin ping -h localhost -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent
      interval: 2s
      retries: 40
    network_mode: service:target-netns
    depends_on:
      target-netns:
        condition: service_started
  target:
    build:
      context: https://github.com/Jay-l-Break/dojo-vulhub.git#023014f02d28845def03c642157062e6af319280
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: jumpserver-local-test
      DB_NAME: jumpserver
      CORE_WORKER: '1'
      EMAIL_HOST: 127.0.0.1
      EMAIL_PORT: '1025'
    network_mode: service:target-netns
    configs:
    - source: jumpserver-hardener
      target: /opt/dojo/jumpserver-hardener.sh
      mode: '0555'
    volumes:
    - oracle-seed:/run/dojo-seed
    post_start:
    - command: /bin/sh /opt/dojo/jumpserver-hardener.sh
      user: root
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target-netns:
        condition: service_started
      mariadb:
        condition: service_healthy
      smtp:
        condition: service_healthy
  smtp:
    image: python:3.10-slim-bookworm@sha256:5be5aaecb962a41567bc8041f1e9e3432cb085b037fe057f9a562630b2e4b370
    command:
    - python
    - -m
    - smtpd
    - -n
    - -c
    - DebuggingServer
    - 127.0.0.1:1025
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1', 1025), 2); assert s.recv(3) == b'220'; s.close()
      interval: 1s
      timeout: 3s
      retries: 30
    network_mode: service:target-netns
    depends_on:
      target-netns:
        condition: service_started
  oracle-init:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: none
    command:
    - /bin/sh
    - -ec
    - python3 /oracle/runtime_oracle.py init --config /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof
    - oracle-socket:/run/dojo-oracle
    - submission:/submission
  oracle:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    environment: {}
    command:
    - python3
    - /oracle/runtime_oracle.py
    - serve
    - --config
    - /oracle/config.json
    volumes:
    - oracle-private:/oracle/private
    - oracle-seed:/run/dojo-seed
    - oracle-proof:/run/oracle-proof:ro
    - oracle-socket:/run/dojo-oracle
    - submission:/submission:ro
    depends_on:
      oracle-init:
        condition: service_completed_successfully
      target:
        condition: service_started
      target-netns:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python3
      - /oracle/runtime_oracle.py
      - health
      - --config
      - /oracle/config.json
      interval: 2s
      timeout: 5s
      retries: 180
  gateway:
    build:
      context: .
      dockerfile: docker/oracle.Dockerfile
    network_mode: service:target-netns
    command:
    - /opt/dojo/gateway-entrypoint.sh
    volumes:
    - forward-bridge:/run/dojo-forward
    depends_on:
      target:
        condition: service_started
      target-netns:
        condition: service_started
networks:
  target-net:
    internal: true
volumes:
  submission: {}
  forward-bridge: {}
  oracle-private: {}
  oracle-seed: {}
  oracle-proof: {}
  oracle-socket: {}
configs:
  jumpserver-hardener:
    file: ./shell/jumpserver-hardener.sh
